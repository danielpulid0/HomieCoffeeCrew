<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes y Métricas | Homie Coffee Crew</title>
    <link rel="stylesheet" href="../css/styles2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <a href="fidelizacion.html" class="nombre-y-logo">
                <img src="../img/homie_logo.png" alt="Logo Homie Coffee Crew">
                <span class="nombre-marca">Homie Coffee Crew</span>
            </a>
            <div class="menu-links">
                <a href="fidelizacion.html">Fidelización</a>
                <a href="catalogo.html">Catálogo</a>
                <a href="reportes.html" class="activo">Reportes y Métricas</a>
            </div>
            <div class="auth-buttons">
                <a href="../login.html" class="btn-icono-salir" aria-label="Cerrar sesión" title="Cerrar sesión">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </a>
            </div>
        </nav>
    </header>

    <main id="reportes">
        <div class="fila-flexible">
            <h1>Reportes generales</h1>
            <select class="select-filtro" aria-label="Periodo del reporte">
                <option value="semana">Esta semana</option>
                <option value="mes">Este mes</option>
                <option value="anio">Este año</option>
            </select>
        </div>

        <div class="kpi-grid">
            <article class="card-kpi">
                <span class="kpi-titulo">Nuevos miembros</span>
                <div class="kpi-dato">
                    <strong>21</strong>
                    <span class="kpi-variacion">+15%</span>
                </div>
            </article>

            <article class="card-kpi">
                <span class="kpi-titulo">Promociones activas</span>
                <div class="kpi-dato">
                    <strong>2</strong>
                </div>
            </article>

            <article class="card-kpi">
                <span class="kpi-titulo">Sellos otorgados</span>
                <div class="kpi-dato">
                    <strong>218</strong>
                    <span class="kpi-variacion">+15%</span>
                </div>
            </article>

            <article class="card-kpi">
                <span class="kpi-titulo">Bebidas Canjeadas</span>
                <div class="kpi-dato">
                    <strong>21</strong>
                    <span class="kpi-variacion">+15%</span>
                </div>
            </article>
        </div>

        <!-- Gráfica -->
        <section class="seccion-grafica">
            <div class="barra-derecha">
                <select class="select-filtro" aria-label="Filtrar métrica en gráfica">
                    <option value="todas">Todas</option>
                    <option value="miembros">Nuevos miembros</option>
                    <option value="sellos">Sellos otorgados</option>
                    <option value="canjes">Bebidas canjeadas</option>
                </select>
            </div>

            <div class="card-grafica">
                <!-- Contenedor listo para Chart.js -->
                <canvas id="graficaReportes"></canvas>
            </div>
        </section>
    </main>
</body>
</html>
